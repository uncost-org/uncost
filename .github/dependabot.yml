version: 2
updates:
  # GitHub Actions: monthly, every update in ONE grouped PR. Actions are few,
  # and the workflows pin most of them by SHA, so one reviewed PR a month is
  # enough.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    # Minor and patch bumps (runtime and dev, direct and transitive) arrive as
    # ONE grouped PR per month: a drip of low-signal PRs trains
    # merge-without-review, which is the habit these gates exist to prevent.
    # Majors stay OUT of the group, so Dependabot opens one PR per major. A
    # major can change the built site or the audit tools themselves (pa11y
    # brings the puppeteer the audits run on), so each needs its own verify.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
