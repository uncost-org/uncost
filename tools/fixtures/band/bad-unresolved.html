<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>band fixture — bad, unresolvable background</title>
<link rel="stylesheet" href="band.css">
<style>
  /* FAULT: this band's background is a gradient, so it has no single colour to
     test a rule against. The audit must report it, not skip the boundary. */
  #gradient { background-image: linear-gradient(180deg, #FAF7F0, #E8B84A); }
</style></head>
<body><main>
  <div class="band bg-cream"><p>First band.</p></div>
  <div class="band r-coral" id="gradient"><p>Background cannot be resolved to one colour.</p></div>
  <div class="band bg-ink r-coral"><p>ink below.</p></div>
</main></body></html>
