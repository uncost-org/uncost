<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>band fixture — good, basic</title>
<link rel="stylesheet" href="band.css"></head>
<body><main>
  <div class="band bg-cream"><p>First band. Nothing above it, so no rule.</p></div>
  <div class="band bg-wheat r-coral"><p>cream to wheat: coral is visible against both.</p></div>
  <div class="band bg-ink r-coral"><p>wheat to ink: coral again.</p></div>
  <div class="band bg-coral r-wheat"><p>ink to coral: coral and ink are both invisible here, so wheat.</p></div>
  <div class="band bg-cream2 r-ink"><p>coral to cream2: coral is out, ink carries it.</p></div>
</main></body></html>
