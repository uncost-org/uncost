<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>band fixture — good, V2 full-bleed frame without sides</title>
<link rel="stylesheet" href="band.css"></head>
<body><main>
  <div class="band bg-cream"><p>First band.</p></div>
  <!-- V2: full-bleed, so the frame omits the edges that would run along the
       viewport. Top and bottom are the frame and carry both boundaries. -->
  <div class="frame2">
    <div class="cell"><p>Cell one.</p></div><div class="cell"><p>Cell two.</p></div>
  </div>
  <div class="band bg-cream2"><p>Last band.</p></div>
</main></body></html>
