<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Table dividers, no frame</title>
<link rel="stylesheet" href="frame.css">
</head><body>
<div class="band">
  <h1>Table dividers, no frame</h1>
  <!-- 2px ink rules between rows, drawn on the row; the table itself has no border. -->
  <table class="t">
    <thead><tr><th>Item</th><th>Amount</th></tr></thead>
    <tbody>
      <tr><td>Hosting</td><td>120</td></tr>
      <tr><td>Domains</td><td>60</td></tr>
      <tr><td>Fonts</td><td>0</td></tr>
    </tbody>
  </table>
</div>
</body></html>
